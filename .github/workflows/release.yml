name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # macOS 26 + Xcode 26,与本地开发环境完全一致(macos-latest 目前仍指向 macOS 15)。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 26 的 SDK 才把 SecIdentityCreate 暴露给 Swift;
          # 旧 SDK(Xcode 16.x)会报 "cannot find 'SecIdentityCreate' in scope"。
          xcode-version: '26'

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (ad-hoc signed, Release)
        run: |
          # 必须让 Xcode 做 ad-hoc 签名(identity "-"),不能 CODE_SIGNING_ALLOWED=NO
          # 整个跳过:跳过签名会导致 bundle 没有封印、appex 的 sandbox entitlements
          # 不被嵌入,pluginkit 验签失败拒绝注册 QuickLook 扩展(插件永远不生效)。
          # ad-hoc 签名不需要任何证书,CI 上开箱即用。
          xcodebuild -project EasySign.xcodeproj -scheme EasySign -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            build

      - name: Package .dmg
        run: |
          brew install create-dmg
          APP="build/Build/Products/Release/EasySign.app"
          DMG="EasySign-${{ steps.ver.outputs.version }}.dmg"
          create-dmg \
            --volname "EasySign ${{ steps.ver.outputs.version }}" \
            --app-drop-link 450 180 \
            --window-size 660 400 \
            "$DMG" "$APP" \
          || hdiutil create -volname "EasySign ${{ steps.ver.outputs.version }}" \
               -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: EasySign-*.dmg
